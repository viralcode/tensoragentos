# Fail2ban filter for OpenWhale Dashboard login failures
# /etc/fail2ban/filter.d/openwhale-dashboard.conf

[Definition]
failregex = ^.*openwhale.*Authentication failed.*from <HOST>.*$
            ^.*openwhale.*Login attempt failed.*<HOST>.*$
            ^.*openwhale.*Invalid credentials.*<HOST>.*$
            ^.*openwhale.*401.*<HOST>.*$

ignoreregex =

datepattern = %%Y-%%m-%%dT%%H:%%M:%%S
              %%b %%d %%H:%%M:%%S
