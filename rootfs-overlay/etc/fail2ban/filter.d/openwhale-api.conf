# Fail2ban filter for OpenWhale API rate limiting
# /etc/fail2ban/filter.d/openwhale-api.conf

[Definition]
failregex = ^.*openwhale.*Rate limit exceeded.*<HOST>.*$
            ^.*openwhale.*Too many requests.*<HOST>.*$
            ^.*openwhale.*429.*<HOST>.*$

ignoreregex =

datepattern = %%Y-%%m-%%dT%%H:%%M:%%S
              %%b %%d %%H:%%M:%%S
