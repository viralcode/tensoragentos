# TensorAgent OS — Fail2ban Jail Configuration
# /etc/fail2ban/jail.d/ainux.conf
#
# Protects SSH and OpenWhale dashboard from brute-force attacks.

[DEFAULT]
# Ban for 1 hour after 5 failures within 10 minutes
bantime  = 3600
findtime = 600
maxretry = 5

# Use UFW for banning (integrates with our firewall)
banaction = ufw

# Email notifications (configure in /etc/fail2ban/jail.local)
# destemail = admin@yourcompany.com
# action = %(action_mwl)s

# ─── SSH Protection ──────────────────────────────────────────────
[sshd]
enabled  = true
port     = ssh
filter   = sshd
logpath  = /var/log/auth.log
maxretry = 3
bantime  = 7200

# ─── OpenWhale Dashboard Protection ─────────────────────────────
[openwhale-dashboard]
enabled  = true
port     = 7777
filter   = openwhale-dashboard
logpath  = /var/log/syslog
maxretry = 5
bantime  = 3600
findtime = 300

# ─── OpenWhale API Rate Limiting ─────────────────────────────────
[openwhale-api]
enabled  = true
port     = 7777
filter   = openwhale-api
logpath  = /var/log/syslog
maxretry = 50
findtime = 60
bantime  = 600
