# TensorAgent OS — Fluent Bit Log Forwarding Configuration
# /etc/fluent-bit/fluent-bit.conf
#
# Forwards system and application logs to a centralized log server.
# Supports: Elasticsearch, Loki, Splunk, Datadog, or any Fluentd endpoint.
#
# To enable:
#   1. Install: sudo apt install fluent-bit
#   2. Edit the [OUTPUT] section below with your log server details
#   3. Enable: sudo systemctl enable fluent-bit
#   4. Start: sudo systemctl start fluent-bit
#

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  Off

# ─── System Journal (all systemd services) ────────────────────────
[INPUT]
    Name              systemd
    Tag               system.*
    Systemd_Filter    _SYSTEMD_UNIT=openwhale.service
    Systemd_Filter    _SYSTEMD_UNIT=ainux-kernel.service
    Systemd_Filter    _SYSTEMD_UNIT=ollama.service
    Systemd_Filter    _SYSTEMD_UNIT=ainux-shell.service
    Read_From_Tail    On
    Strip_Underscores On

# ─── Auth Logs ────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               auth.*
    Path              /var/log/auth.log
    Parser            syslog
    Refresh_Interval  10

# ─── Audit Logs ───────────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               audit.*
    Path              /var/log/audit/audit.log
    Refresh_Interval  5

# ─── Kernel Messages ─────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               kern.*
    Path              /var/log/kern.log
    Parser            syslog
    Refresh_Interval  30

# ─── Add hostname and OS metadata ────────────────────────────────
[FILTER]
    Name              record_modifier
    Match             *
    Record            hostname ${HOSTNAME}
    Record            os tensoragent-os
    Record            environment production

# ─── Filter: only forward WARNING+ from kernel ───────────────────
[FILTER]
    Name              grep
    Match             kern.*
    Exclude           log .*info.*

# ═══════════════════════════════════════════════════════════════════
# OUTPUT — Uncomment ONE of the following sections
# ═══════════════════════════════════════════════════════════════════

# ─── Option 1: Elasticsearch / OpenSearch ─────────────────────────
# [OUTPUT]
#     Name              es
#     Match             *
#     Host              elasticsearch.yourcompany.com
#     Port              9200
#     Index             tensoragent-logs
#     Type              _doc
#     Logstash_Format   On
#     Logstash_Prefix   tensoragent
#     tls               On
#     tls.verify        On
#     HTTP_User         elastic
#     HTTP_Passwd       ${ES_PASSWORD}

# ─── Option 2: Grafana Loki ──────────────────────────────────────
# [OUTPUT]
#     Name              loki
#     Match             *
#     Host              loki.yourcompany.com
#     Port              3100
#     Labels            job=tensoragent,host=${HOSTNAME}
#     Auto_Kubernetes_Labels Off
#     tls               On

# ─── Option 3: Splunk HEC ────────────────────────────────────────
# [OUTPUT]
#     Name              splunk
#     Match             *
#     Host              splunk.yourcompany.com
#     Port              8088
#     Splunk_Token      ${SPLUNK_HEC_TOKEN}
#     Splunk_Send_Raw   On
#     tls               On

# ─── Option 4: Generic Fluentd Forward ────────────────────────────
# [OUTPUT]
#     Name              forward
#     Match             *
#     Host              logserver.yourcompany.com
#     Port              24224

# ─── Option 5: Datadog ───────────────────────────────────────────
# [OUTPUT]
#     Name              datadog
#     Match             *
#     apikey            ${DD_API_KEY}
#     dd_service        tensoragent-os
#     dd_source         linux
#     dd_tags            env:production,os:tensoragent

# ─── Default: stdout (for testing) ───────────────────────────────
[OUTPUT]
    Name              stdout
    Match             *
    Format            json_lines
