# TensorAgent OS — Default Security Configuration
# /etc/ainux/security.conf
#
# This file configures the security posture of TensorAgent OS.
# Modify these settings to match your enterprise security policy.
#

[sandbox]
# Enable sandboxed execution for AI agent tool calls.
# When enabled, the agent cannot execute arbitrary commands outside
# the approved workspace directory without explicit human approval.
# Values: true (recommended), false (development/lab only)
enabled=true

# Workspace directory — the agent can only modify files within this path.
# The agent will be denied access to system directories like /etc, /usr, /boot.
workspace=/home/ainux/Works

# Require human-in-the-loop approval for destructive operations.
# When enabled, commands that modify system state (install packages,
# modify services, delete files outside workspace) require dashboard approval.
require_approval=true

# Maximum iterations for agentic loops (prevents runaway agents)
max_iterations=15

[network]
# Restrict outbound network access from AI agent
# Values: unrestricted, local_only, allowlist
outbound_policy=unrestricted

# Allowed outbound domains when outbound_policy=allowlist
# allowlist=api.anthropic.com,api.openai.com,ollama.localhost

[logging]
# Audit level for AI agent operations
# Values: minimal, standard, verbose
audit_level=standard

# Log all tool calls to audit trail
log_tool_calls=true

# Log AI model inputs/outputs (WARNING: may contain sensitive data)
log_model_io=false

# Remote syslog server for centralized logging (enterprise)
# syslog_server=
# syslog_port=514
# syslog_protocol=tcp

[authentication]
# Session timeout for dashboard (minutes)
session_timeout=30

# Maximum failed login attempts before lockout
max_failed_attempts=5

# Lockout duration after max failed attempts (minutes)
lockout_duration=15

# Require MFA for dashboard access (future)
# mfa_required=false

[updates]
# Automatic security updates
auto_security_updates=true

# Verify update signatures
verify_signatures=true

# Update channel: stable, beta, nightly
channel=stable
