# TensorAgent OS — AI Agent Command Security Policy
# /etc/ainux/command-policy.conf
#
# Defines which commands the AI agent is allowed and denied to execute.
# This is the enforcement layer between OpenWhale's tool calls and the OS.
#
# Format:
#   DENY <pattern>     — Block command (takes priority over ALLOW)
#   ALLOW <pattern>    — Permit command
#   APPROVE <pattern>  — Require human approval before execution
#
# Patterns use shell glob matching. Order matters: first match wins
# within each priority level (DENY > APPROVE > ALLOW).
#

# ═══════════════════════════════════════════════════════════════════
# DENY — Absolutely blocked commands (cannot be overridden)
# ═══════════════════════════════════════════════════════════════════

# Destructive filesystem operations
DENY rm -rf /
DENY rm -rf /*
DENY rm -rf /etc*
DENY rm -rf /usr*
DENY rm -rf /boot*
DENY rm -rf /var*
DENY rm -rf /home
DENY rm -rf /opt/ainux*

# Disk wiping
DENY dd if=* of=/dev/sd*
DENY dd if=* of=/dev/nvme*
DENY dd if=* of=/dev/vd*
DENY mkfs*
DENY fdisk*
DENY parted*
DENY wipefs*
DENY shred /dev/*

# Kernel manipulation
DENY insmod*
DENY modprobe*
DENY rmmod*
DENY sysctl -w*

# User/credential manipulation
DENY passwd root
DENY userdel*
DENY groupdel*
DENY chpasswd*
DENY usermod -G*root*
DENY visudo*

# Network danger
DENY iptables -F
DENY iptables -X
DENY ufw disable
DENY ufw reset
DENY ip link set * down
DENY systemctl stop ufw
DENY systemctl disable ufw
DENY systemctl stop apparmor
DENY systemctl disable apparmor
DENY systemctl stop auditd
DENY systemctl disable auditd

# Security bypass
DENY setenforce 0
DENY aa-teardown
DENY aa-disable*
DENY chmod 777 /*
DENY chmod -R 777*
DENY setfacl*

# Pipe to shell (supply chain attack vector)
DENY curl * | bash
DENY curl * | sh
DENY wget * | bash
DENY wget * | sh
DENY curl * | sudo*
DENY wget * | sudo*

# Container/VM escape
DENY docker run --privileged*
DENY docker run -v /:/host*
DENY nsenter*
DENY unshare*

# Crypto mining / abuse
DENY *xmrig*
DENY *minerd*
DENY *cpuminer*
DENY *stratum+tcp*

# ═══════════════════════════════════════════════════════════════════
# APPROVE — Require human-in-the-loop approval
# ═══════════════════════════════════════════════════════════════════

# Package management
APPROVE apt install*
APPROVE apt remove*
APPROVE apt purge*
APPROVE apt-get install*
APPROVE apt-get remove*
APPROVE dpkg -i*
APPROVE snap install*
APPROVE flatpak install*
APPROVE pip install*
APPROVE npm install -g*

# Service management
APPROVE systemctl enable*
APPROVE systemctl disable*
APPROVE systemctl start*
APPROVE systemctl stop*
APPROVE systemctl restart*

# File operations outside workspace
APPROVE rm -rf*
APPROVE rm -r*
APPROVE mv /home/ainux/Works/* /
APPROVE cp * /etc/*
APPROVE cp * /usr/*

# Network configuration
APPROVE nmcli connection*
APPROVE ip addr*
APPROVE ip route*

# Cron jobs
APPROVE crontab*

# System configuration
APPROVE hostnamectl*
APPROVE timedatectl*
APPROVE localectl*

# ═══════════════════════════════════════════════════════════════════
# ALLOW — Permitted without approval
# ═══════════════════════════════════════════════════════════════════

# File operations in workspace
ALLOW ls*
ALLOW cat*
ALLOW head*
ALLOW tail*
ALLOW grep*
ALLOW find /home/ainux/Works*
ALLOW wc*
ALLOW sort*
ALLOW uniq*
ALLOW cut*
ALLOW awk*
ALLOW sed*
ALLOW diff*
ALLOW file*

# Workspace file management
ALLOW mkdir -p /home/ainux/Works/*
ALLOW touch /home/ainux/Works/*
ALLOW cp /home/ainux/Works/*
ALLOW mv /home/ainux/Works/*
ALLOW rm /home/ainux/Works/*

# Development tools
ALLOW node*
ALLOW npm run*
ALLOW npm test*
ALLOW npx*
ALLOW python3*
ALLOW git *
ALLOW make*
ALLOW gcc*
ALLOW g++*
ALLOW cargo*

# System info (read-only)
ALLOW uname*
ALLOW hostname*
ALLOW whoami
ALLOW id
ALLOW date
ALLOW uptime
ALLOW free*
ALLOW df*
ALLOW du*
ALLOW top -bn1*
ALLOW htop*
ALLOW ps*
ALLOW lscpu
ALLOW lsmem
ALLOW lsblk
ALLOW ip addr show
ALLOW ip route show
ALLOW ss -tlnp
ALLOW systemctl status*
ALLOW journalctl*

# Text editors (in workspace)
ALLOW nano /home/ainux/Works/*
ALLOW vim /home/ainux/Works/*
ALLOW code /home/ainux/Works/*

# Archive operations (in workspace)
ALLOW tar*
ALLOW zip*
ALLOW unzip*
ALLOW gzip*
ALLOW gunzip*

# Network tools (diagnostic)
ALLOW ping*
ALLOW curl*
ALLOW wget -O /home/ainux/Works/*
ALLOW dig*
ALLOW nslookup*
ALLOW traceroute*
ALLOW ssh*
ALLOW scp*

# AI/ML tools
ALLOW ollama*
ALLOW python3 -c*
