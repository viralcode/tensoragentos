# TensorAgent OS — osquery Fleet Configuration
# /etc/osquery/osquery.conf
#
# Provides fleet-wide visibility via osquery.
# Compatible with FleetDM, Kolide, and standalone mode.
#
# Install: sudo apt install osquery
# Enable: sudo systemctl enable osqueryd && sudo systemctl start osqueryd
#

{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "logger_path": "/var/log/osquery",
    "disable_logging": "false",
    "schedule_splay_percent": "10",
    "events_expiry": "3600",
    "verbose": "false",
    "worker_threads": "2",
    "enable_monitor": "true",
    "disable_events": "false",
    "disable_audit": "false",
    "audit_allow_config": "true",
    "host_identifier": "hostname",
    "enable_syslog": "true",
    "audit_allow_sockets": "true",
    "schedule_default_interval": "3600"
  },

  "schedule": {
    "system_info": {
      "query": "SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;",
      "interval": 3600,
      "description": "System hardware info"
    },

    "os_version": {
      "query": "SELECT name, version, major, minor, patch, build, platform FROM os_version;",
      "interval": 3600,
      "description": "OS version details"
    },

    "uptime": {
      "query": "SELECT days, hours, minutes, total_seconds FROM uptime;",
      "interval": 600,
      "description": "System uptime"
    },

    "logged_in_users": {
      "query": "SELECT type, user, host, time FROM logged_in_users WHERE type = 'user';",
      "interval": 300,
      "description": "Currently logged in users"
    },

    "listening_ports": {
      "query": "SELECT pid, port, protocol, address, family FROM listening_ports WHERE port != 0;",
      "interval": 300,
      "description": "All listening network ports"
    },

    "openwhale_service": {
      "query": "SELECT name, state, sub_state, active_state FROM systemd_units WHERE name = 'openwhale.service';",
      "interval": 60,
      "description": "OpenWhale service health"
    },

    "ollama_service": {
      "query": "SELECT name, state, sub_state, active_state FROM systemd_units WHERE name = 'ollama.service';",
      "interval": 60,
      "description": "Ollama LLM service health"
    },

    "ainux_services": {
      "query": "SELECT name, state, sub_state, active_state FROM systemd_units WHERE name LIKE 'ainux%';",
      "interval": 60,
      "description": "All AInux services health"
    },

    "security_services": {
      "query": "SELECT name, state, sub_state FROM systemd_units WHERE name IN ('apparmor.service', 'auditd.service', 'ufw.service', 'fail2ban.service');",
      "interval": 120,
      "description": "Security services status"
    },

    "apparmor_profiles": {
      "query": "SELECT name, mode, attach FROM apparmor_profiles;",
      "interval": 600,
      "description": "AppArmor profile enforcement status"
    },

    "disk_usage": {
      "query": "SELECT path, type, blocks_size, blocks_available, blocks, inodes, inodes_free FROM mounts WHERE path IN ('/', '/home', '/opt');",
      "interval": 600,
      "description": "Disk usage for critical partitions"
    },

    "memory_usage": {
      "query": "SELECT memory_total, memory_free, buffers, cached, swap_total, swap_free FROM memory_info;",
      "interval": 120,
      "description": "Memory utilization"
    },

    "cpu_usage": {
      "query": "SELECT cpu_time, idle_ticks, nice_ticks, system_ticks, user_ticks FROM cpu_time;",
      "interval": 120,
      "description": "CPU utilization"
    },

    "failed_logins": {
      "query": "SELECT username, type, time, host, facility FROM last WHERE type = 2 ORDER BY time DESC LIMIT 20;",
      "interval": 300,
      "description": "Recent failed login attempts"
    },

    "cron_jobs": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 3600,
      "description": "Scheduled cron jobs"
    },

    "suid_binaries": {
      "query": "SELECT path, username, groupname, permissions FROM suid_bin;",
      "interval": 3600,
      "description": "SUID binaries (privilege escalation vectors)"
    },

    "network_interfaces": {
      "query": "SELECT interface, address, mask, type FROM interface_addresses WHERE NOT (interface LIKE 'lo%' OR interface LIKE 'docker%');",
      "interval": 600,
      "description": "Network interface configuration"
    },

    "iptables_rules": {
      "query": "SELECT filter_name, chain, policy, target, protocol, src_ip, dst_ip, dst_port FROM iptables;",
      "interval": 600,
      "description": "Firewall rules"
    },

    "node_processes": {
      "query": "SELECT pid, name, cmdline, resident_size, user_time, system_time FROM processes WHERE name = 'node';",
      "interval": 120,
      "description": "Node.js process health (OpenWhale, kernel)"
    },

    "ai_workspace_files": {
      "query": "SELECT path, filename, size, mtime, uid FROM file WHERE directory = '/home/ainux/Works' AND mtime > (strftime('%s','now') - 3600);",
      "interval": 300,
      "description": "Recently modified files in AI workspace"
    }
  },

  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system_info;",
      "SELECT hostname AS hostname FROM system_info;"
    ]
  },

  "packs": {
    "incident-response": "/usr/share/osquery/packs/incident-response.conf",
    "vuln-management": "/usr/share/osquery/packs/vuln-management.conf"
  }
}
